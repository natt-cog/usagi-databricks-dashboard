bundle:
  name: usagi-databricks-dashboard

include:
  - resources/*.yml

variables:
  warehouse_id:
    description: ダッシュボードと Streamlit アプリが使う SQL Warehouse
    lookup:
      warehouse: Serverless Starter Warehouse

targets:
  demo:
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
